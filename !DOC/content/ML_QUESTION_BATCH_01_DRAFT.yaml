  - question_key: "mltech_030"
    revision_no: 1
    content_fingerprint: "01ce59f1ad8b6a7fd9ce5a7a3f5d0669577039b25d85ae036acc064155b69f6a"
    status: "draft"
    topic_id: "inference_mlops"
    question_ru: "Чем непрерывное пакетирование запросов к LLM отличается от статического батча и как оно меняет пропускную способность и задержку?"
    difficulty: "hard"
    tags:
      - "continuous_batching"
      - "llm_serving"
      - "throughput"
      - "latency"
      - "load_testing"
    rubric_points:
      - id: "static_batch_limit"
        point_ru: "Статический батч держит фиксированный состав до завершения, поэтому короткие последовательности ждут самые длинные и оставляют ускоритель недогруженным."
      - id: "continuous_batching"
        point_ru: "Непрерывное пакетирование добавляет новые запросы и удаляет завершённые между шагами генерации."
      - id: "prefill_and_decode"
        point_ru: "Prefill обрабатывает входной контекст крупными матричными операциями, а decode добавляет токены по одному; chunked prefill и приоритет decode меняют компромисс между TTFT и inter-token latency."
      - id: "throughput_gain"
        point_ru: "Более плотная загрузка ускорителя увеличивает число обработанных токенов и запросов в единицу времени."
      - id: "latency_tradeoff"
        point_ru: "Слишком большой пакет улучшает пропускную способность, но может увеличить ожидание первого токена и хвостовую задержку."
      - id: "resource_admission"
        point_ru: "Планировщик знает текущие длины, заявленный max_tokens, лимиты последовательностей и занятые блоки KV-cache, но не точную будущую длину генерации."
      - id: "measurement"
        point_ru: "Под реалистичной нагрузкой измеряют TTFT, inter-token и end-to-end latency, P95/P99, token и request throughput, ошибки и goodput при заданном SLO."
    reference_explanation_ru: >-
      Генерация идёт по одному токену, а запросы имеют разную длину. В статическом батче
      завершившийся запрос оставляет пустое место до конца самого длинного. Непрерывный
      планировщик удаляет завершённые запросы и добавляет новые между шагами, повышая
      загрузку ускорителя. На prefill обрабатывается входной контекст, на decode токены
      добавляются по одному; chunked prefill и приоритет decode меняют баланс TTFT и
      inter-token latency. Планировщик учитывает текущие длины, max_tokens, лимиты и
      KV-cache, но не знает точную будущую длину ответа. Выигрыш в throughput не
      бесплатен: очередь и крупный пакет могут ухудшить TTFT и P95/P99. Поэтому вместе
      измеряют TTFT, inter-token и end-to-end latency, token и request throughput,
      ошибки и goodput при заданном SLO.
    follow_ups:
      - "Почему максимальная пропускная способность не всегда является правильной целью сервиса?"
      - "Какие ограничения поставить, чтобы один длинный запрос не ухудшил задержку остальных?"
