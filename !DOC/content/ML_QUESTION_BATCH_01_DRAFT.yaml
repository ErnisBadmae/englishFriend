  - question_key: "mltech_022"
    revision_no: 1
    content_fingerprint: "f5c8714eee1820d4cf18665f450da7e2323fdb366a7eaca31201c7929a92f054"
    status: "draft"
    topic_id: "ml_fundamentals"
    question_ru: "Как CatBoost обрабатывает категориальные признаки и почему обычное кодирование средним целевого признака создаёт утечку?"
    difficulty: "medium"
    tags:
      - "catboost"
      - "categorical_features"
      - "target_encoding"
      - "data_leakage"
      - "gradient_boosting"
    rubric_points:
      - id: "category_representation"
        point_ru: "CatBoost принимает категориальные значения как строки или идентификаторы и внутри строит числовые представления, не требуя внешнего наивного target encoding."
      - id: "one_hot_or_ctr"
        point_ru: "Часть низкокардинальных категорий кодируется one-hot, а для остальных могут строиться CTR и комбинации категориальных признаков."
      - id: "naive_target_leakage"
        point_ru: "Если среднее по категории считать на всей выборке, целевая метка строки прямо или косвенно попадает в её признак."
      - id: "ordered_statistics"
        point_ru: "Упорядоченные целевые статистики для строки используют только предыдущие объекты в перестановке и сглаживание."
      - id: "ordered_boosting_distinction"
        point_ru: "Упорядоченные целевые статистики и ordered boosting - связанные, но разные механизмы: первый строит признаки, второй уменьшает смещение при оценке градиента."
      - id: "rare_categories"
        point_ru: "Сглаживание и априорное значение уменьшают шум редких категорий и риск переобучения."
      - id: "validation_boundary"
        point_ru: "Преобразования для проверки и теста строятся без их целевых меток и с тем же протоколом, что будет на боевых данных."
    reference_explanation_ru: >-
      CatBoost принимает категориальные значения и внутри выбирает представление:
      для части низкокардинальных признаков использует one-hot, для остальных может
      строить CTR и комбинации категорий. Наивное среднее целевой метки по категории
      знает ответы той же выборки и особенно опасно для редких значений. Упорядоченная
      целевая статистика для текущей строки использует только предшествующие объекты
      в перестановке и сглаживание. Это не то же самое, что ordered boosting:
      статистика строит категориальный признак, а ordered boosting уменьшает смещение
      при оценке градиента. Цели validation и test не используются; преобразования
      строятся по train и сохранённому состоянию модели.
    follow_ups:
      - "Почему редкая категория особенно опасна для обычного кодирования средним?"
      - "Когда one-hot кодирование всё же будет разумным выбором?"
