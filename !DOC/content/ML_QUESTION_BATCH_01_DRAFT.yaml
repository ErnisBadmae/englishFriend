  - question_key: "mltech_028"
    revision_no: 1
    content_fingerprint: "d32acfa08cca262951974adc2e1ca649d3db8be8975887bf90fe0b1e26dc4f8a"
    status: "draft"
    topic_id: "rag_agents_evaluation"
    question_ru: "Как построить набор сценарных проверок для LLM-агента, который вызывает инструменты и меняет состояние системы?"
    difficulty: "hard"
    tags:
      - "agent_evaluation"
      - "scenario_testing"
      - "tool_calls"
      - "state_transitions"
      - "idempotency"
    rubric_points:
      - id: "scenario_contract"
        point_ru: "Сценарий фиксирует начальное состояние, вход пользователя, разрешённые действия и проверяемый итог."
      - id: "tool_call_checks"
        point_ru: "Отдельно проверяют выбор инструмента, аргументы, порядок вызовов и запрет неразрешённых действий."
      - id: "state_checks"
        point_ru: "Проверяют итоговое состояние и побочные эффекты, а не только правдоподобный текст ответа."
      - id: "failure_routes"
        point_ru: "Набор включает таймауты, пустые результаты, ошибки инструмента, повторную доставку и неоднозначный запрос."
      - id: "idempotency"
        point_ru: "Повтор одного события не должен создавать второй платёж, запись или другое необратимое действие."
      - id: "operational_metrics"
        point_ru: "Кроме успешности сценария измеряют задержку, стоимость, число вызовов и долю передачи человеку."
    reference_explanation_ru: >-
      Текстовый ответ не доказывает правильность агента. Сценарная проверка задаёт
      исходное состояние и ожидаемый результат, затем проверяет вызовы инструментов,
      аргументы, изменение данных и побочные эффекты. Обязательны пути ошибок и
      повторной доставки, потому что именно они создают опасные двойные действия.
      Модель можно использовать для оценки формулировки, но права на действия,
      инварианты состояния и идемпотентность должны проверяться кодом.
    follow_ups:
      - "Что проверить в сценарии, где инструмент выполнил действие, но ответ не дошёл до агента?"
      - "Какие части такой проверки допустимо поручить LLM-судье?"
