  - question_key: "mltech_023"
    revision_no: 1
    content_fingerprint: "11c3cd5e6c8415a2c8d5971ee37093e20213547fe42b62d1d2c93def965b8157"
    status: "draft"
    topic_id: "ml_fundamentals"
    question_ru: "Чем ROC-AUC отличается от Average Precision, почему ни одна из них не задаёт рабочий порог и как выбрать порог при дисбалансе классов?"
    difficulty: "medium"
    tags:
      - "roc_auc"
      - "average_precision"
      - "class_imbalance"
      - "threshold_selection"
      - "classification_metrics"
    rubric_points:
      - id: "roc_auc_meaning"
        point_ru: "ROC-AUC оценивает способность ранжировать положительный объект выше отрицательного по всем порогам."
      - id: "average_precision_meaning"
        point_ru: "Average Precision суммирует precision с весами по приросту recall и, в отличие от трапецеидальной PR-AUC, не интерполирует линейно между точками."
      - id: "prevalence_baseline"
        point_ru: "Базовый уровень precision равен доле положительного класса, поэтому AP зависит от class prior и осторожно сравнивается между выборками с разной распространённостью класса."
      - id: "threshold_independence"
        point_ru: "Обе площади суммируют качество по множеству порогов и сами не выбирают рабочий порог."
      - id: "business_costs"
        point_ru: "Порог выбирают на отложенных данных по стоимости ошибок, ограничениям пропускной способности или требуемым precision и recall."
      - id: "ranking_vs_calibration"
        point_ru: "Высокая AUC или AP не означает корректных вероятностей; калибровка нужна для вероятностных решений, но порог по стоимости можно выбрать и по некалиброванному score."
      - id: "target_shift"
        point_ru: "После сдвига доли классов порог и калибровку перепроверяют на целевом распределении."
    reference_explanation_ru: >-
      ROC-AUC оценивает порядок пар положительных и отрицательных объектов, поэтому
      может выглядеть высокой при сильном дисбалансе. Average Precision суммирует
      precision с весами по приросту recall без линейной интерполяции между точками;
      это не трапецеидальная площадь под PR-кривой. Её естественный ориентир - доля
      положительного класса, поэтому AP зависит от class prior. Ни ROC-AUC, ни AP не
      определяют решение для отдельного объекта. Рабочий порог выбирают на отложенных
      данных по цене ошибок, нужной полноте, точности или доступному ресурсу. Высокое
      качество ранжирования не означает калиброванные вероятности. После сдвига доли
      классов порог и, если нужны вероятности, калибровку проверяют заново.
    follow_ups:
      - "Почему ROC-AUC может почти не измениться после монотонного преобразования оценок модели?"
      - "Как выбрать порог, если команда может обработать только фиксированное число сигналов в день?"
