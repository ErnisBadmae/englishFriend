        point_ru: "Эталонный набор связывает запросы с релевантными фрагментами и, где возможно, с проверяемыми ответами."
      - id: "retrieval_metrics"
        point_ru: "Поиск оценивают отдельно через Recall@K, MRR или NDCG и проверяют, попало ли основание в верхние результаты."
      - id: "generation_metrics"
        point_ru: "Генерацию оценивают по корректности, соответствию вопросу и подтверждаемости ответа найденными источниками."
      - id: "oracle_split"
        point_ru: "Запуск генерации на эталонных фрагментах отделяет ошибку генератора от ошибки поиска."
      - id: "segmented_analysis"
        point_ru: "Результаты разбивают по типам документов, сложности запросов и причинам отказа, а не ограничиваются одним средним числом."
    reference_explanation_ru: >-
      Одна итоговая оценка скрывает источник ошибки. Сначала проверяют, найден ли
      релевантный фрагмент в первых K результатах. Затем оценивают ответ на найденном
      контексте: верность, уместность и подтверждаемость. Полезный диагностический
      приём - дать генератору эталонный фрагмент. Если ответ всё равно неверен, проблема
      не в поиске. Набор примеров должен хранить ожидаемые основания и поддерживать
      разбор по типам ошибок.
