  - question_key: "mltech_021"
    revision_no: 1
    content_fingerprint: "f4df458a309af3bbeb3556b7ebe2f40f501724a53c8980c462e838d65e980ede"
    status: "draft"
    topic_id: "recsys_ranking"
    question_ru: "Чем поточечное, попарное и списочное обучение ранжированию отличаются по цели и как подготовить группы запросов для YetiRank в CatBoost?"
    difficulty: "hard"
    tags:
      - "learning_to_rank"
      - "pointwise"
      - "pairwise"
      - "listwise"
      - "catboost"
      - "yetirank"
    rubric_points:
      - id: "pointwise"
        point_ru: "Поточечный подход предсказывает метку или полезность каждого объекта независимо и напрямую не оптимизирует порядок."
      - id: "pairwise"
        point_ru: "Попарный подход учится правильно упорядочивать пары объектов внутри одного запроса."
      - id: "listwise"
        point_ru: "Списочные методы используют контекст списка и обычно оптимизируют дифференцируемый суррогат недифференцируемой метрики ранжирования, а не саму метрику напрямую."
      - id: "group_context"
        point_ru: "group_id обозначает один контекст выбора, например запрос или показ; вся история пользователя является одной группой только если объекты действительно конкурировали в одном решении."
      - id: "group_layout"
        point_ru: "Строки одной группы в CatBoost должны идти подряд, а обучающие пары не могут пересекать границу группы."
      - id: "yetirank_role"
        point_ru: "YetiRank Classic использует группы и стохастически создаваемые внутри группы пары; его нельзя без оговорки называть чисто списочным методом."
      - id: "ranking_weights"
        point_ru: "group_weight задаёт вес всей группы, pairs_weight - вес конкретной пары; это не произвольный вес строки для любой функции ранжирования."
    reference_explanation_ru: >-
      Поточечная модель решает обычную регрессию или классификацию для каждого объекта.
      Попарная сравнивает объекты внутри одного контекста, а списочные методы учитывают
      список и обычно оптимизируют суррогат метрики порядка. YetiRank Classic в
      CatBoost использует группы и стохастически созданные внутри группы пары, поэтому
      называть его чисто списочным методом неточно. group_id должен обозначать один
      запрос или показ; вся история пользователя подходит только если объекты реально
      конкурировали в одном решении. Строки группы должны идти подряд, пары не могут
      пересекать её границу. group_weight относится ко всей группе, pairs_weight - к
      паре; их семантика не равна произвольному весу отдельной строки.
    follow_ups:
      - "Когда простой поточечный ранжировщик может быть разумнее списочного?"
      - "Что произойдёт, если случайно объединить объекты разных пользователей в одну группу?"
