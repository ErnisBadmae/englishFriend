  - question_key: "mltech_025"
    revision_no: 1
    content_fingerprint: "67a2c206e909bdcdf762ad2defd58aaa15b757ce229892920324418f2adf664a"
    status: "draft"
    topic_id: "ml_fundamentals"
    question_ru: "Как выбрать между случайным, групповым и вложенным разбиением данных, чтобы проверить нужный сценарий обобщения и не получить утечку?"
    difficulty: "medium"
    tags:
      - "cross_validation"
      - "data_split"
      - "data_leakage"
      - "group_split"
      - "nested_cv"
      - "near_duplicate_leakage"
    rubric_points:
      - id: "iid_assumption"
        point_ru: "Случайное разбиение допустимо только когда наблюдения достаточно независимы и одинаково распределены."
      - id: "deployment_target"
        point_ru: "Схему выбирают по боевому сценарию: будущие события известных групп и предсказание для новых групп требуют разных проверок."
      - id: "group_split"
        point_ru: "GroupKFold держит зависимую группу целиком в одном фолде, StratifiedGroupKFold дополнительно старается сохранить баланс классов, а leave-one-group-out проверяет перенос на отдельную новую группу."
      - id: "known_vs_new_entities"
        point_ru: "Полный holdout пользователя измеряет качество на новых пользователях и не заменяет проверку будущих событий уже известных пользователей."
      - id: "near_duplicates"
        point_ru: "Дубли и почти дубли документов сначала объединяют общим идентификатором и не допускают их попадания в разные фолды."
      - id: "pipeline_fit"
        point_ru: "Заполнение пропусков, масштабирование, отбор признаков и кодирование обучают внутри каждого обучающего фолда."
      - id: "untouched_test"
        point_ru: "Тестовую выборку не используют для выбора признаков, модели и гиперпараметров; к ней обращаются после завершения выбора."
      - id: "nested_selection"
        point_ru: "Если кросс-валидация одновременно нужна для настройки и оценки, внешний цикл измеряет качество, а внутренний выбирает модель и гиперпараметры."
    reference_explanation_ru: >-
      Схема проверки должна отвечать боевому сценарию обобщения. Случайный KFold
      допустим для достаточно независимых и одинаково распределённых строк.
      GroupKFold удерживает пользователя, объект или документ внутри одного фолда;
      StratifiedGroupKFold дополнительно старается сохранить баланс меток, а
      leave-one-group-out проверяет перенос на конкретную новую группу. Полный
      holdout пользователя отвечает на вопрос о новых пользователях, а не о будущих
      событиях известных. Дубли и почти дубли объединяют в одну группу. Все обучаемые
      преобразования подгоняют внутри train-фолда. При настройке и оценке на CV нужен
      вложенный протокол или отдельный нетронутый тест.
    follow_ups:
      - "Почему масштабирование до кросс-валидации является утечкой?"
      - "Когда нужен вложенный цикл кросс-валидации, а когда достаточно отдельного теста?"
