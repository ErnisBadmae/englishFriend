content_fingerprint_metadata:
  algorithm: "sha256"
  logical_content: "question_text + reference_answer"
  source_fields:
    - "question_ru"
    - "reference_explanation_ru"
  canonicalization_ru: >-
    Каждое поле приводится к Unicode NFC, все последовательности пробельных
    символов заменяются одним ASCII-пробелом, пробелы по краям удаляются.
    Очищенные question_ru и reference_explanation_ru соединяются одним LF,
    результат кодируется в UTF-8 и хешируется SHA-256.
  purpose_ru: >-
    Отпечаток фиксирует версию содержимого вопроса и помогает находить точные
    дубли внутри подготовленного пакета. Он не является проверкой совпадений
    с частным корпусом.
  scope_note_ru: >-
    Это локальный source-content fingerprint по двум полям (question_ru +
    reference_explanation_ru), рассчитанный только для целей данного черновика
    и по описанной здесь канонизации. Это НЕ MlQuestionBankService.question_content_hash
    и не future-версия будущего БД content_hash - это самостоятельная,
    отдельная от БД величина. При импорте MlQuestionBankService пересчитывает
    свой content_hash отдельно, по собственному набору из 19 полей и своей
    собственной канонизации; значения 15 fingerprint из этого файла с ним не
    совпадают и не предназначены для сравнения с ним.
aggregate_provenance:
  note_ru: >-
    Пакет составлен по локальным очищенным сводкам вопросов с технических
    собеседований. Формулировки, разборы и критерии ответа созданы заново:
    частные источники, ссылки, имена людей и названия компаний не переносились.
    Материал предназначен только для внутренней подготовки и не может быть
    импортирован или опубликован без технического ревью и одобрения владельца.
