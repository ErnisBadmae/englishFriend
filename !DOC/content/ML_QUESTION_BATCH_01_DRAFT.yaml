  - question_key: "mltech_024"
    revision_no: 1
    content_fingerprint: "edb6ac89f7017643a93cc1d6b02cb2d75a68cdb3218d5c74af194ebedf4c51be"
    status: "draft"
    topic_id: "ml_fundamentals"
    question_ru: "Как спроектировать A/B-тест для новой модели: выбрать единицу случайного распределения, размер выборки, основную метрику и правило решения?"
    difficulty: "hard"
    tags:
      - "ab_testing"
      - "randomization"
      - "sample_size"
      - "p_value"
      - "confidence_interval"
      - "mde"
    rubric_points:
      - id: "hypothesis_metric"
        point_ru: "До запуска фиксируют гипотезу, основную метрику, защитные метрики и направление ожидаемого эффекта."
      - id: "randomization_unit"
        point_ru: "Единицу случайного распределения выбирают так, чтобы варианты не смешивались и наблюдения не считались независимыми ошибочно."
      - id: "sample_size"
        point_ru: "Размер и длительность определяют по базовому уровню, минимальному полезному эффекту, мощности и допустимой вероятности ложного срабатывания."
      - id: "p_value_scope"
        point_ru: "p-value показывает совместимость данных с нулевой гипотезой, но не вероятность того, что гипотеза верна."
      - id: "effect_interval"
        point_ru: "Решение опирается не только на значимость, но и на величину эффекта и доверительный интервал."
      - id: "quality_checks"
        point_ru: "До вывода проверяют перекос распределения трафика, качество событий, сезонность и заранее оговорённое правило остановки."
    reference_explanation_ru: >-
      Хороший эксперимент начинается до запуска: фиксируются гипотеза, основная и
      защитные метрики, единица случайного распределения, минимальный полезный эффект,
      мощность и уровень ошибки первого рода. После запуска проверяют корректность
      распределения трафика и данных. p-value не равен вероятности истинности гипотезы,
      поэтому решение принимают по величине эффекта, доверительному интервалу и
      практической ценности, а не только по границе статистической значимости.
    follow_ups:
      - "Почему нельзя каждый день смотреть p-value и остановиться при первом значении ниже порога?"
      - "Когда распределять нужно по пользователю, а не по отдельному показу?"
