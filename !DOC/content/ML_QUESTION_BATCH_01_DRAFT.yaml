      - "fail_closed"
      - "human_review"
    rubric_points:
      - id: "explicit_rubric"
        point_ru: "Судья получает узкую проверяемую шкалу и структурированный формат, а не просьбу оценить ответ вообще."
      - id: "human_calibration"
        point_ru: "Эталон имеет независимую человеческую разметку, правило разрешения разногласий и отдельный holdout, который не использовали для настройки порога."
      - id: "known_biases"
        point_ru: "Порядок вариантов проверяют перестановками, а позиционное, стилевое и родственное модели смещения измеряют раздельно."
      - id: "deterministic_veto"
        point_ru: "Факты, формат, числовые ограничения и ссылки на источник по возможности повторно проверяет детерминированный код."
      - id: "empirical_gate"
        point_ru: "Автоматический маршрут использует эмпирически проверенный порог по классу сценария; самооценка уверенности судьи не считается вероятностью правильности."
      - id: "safety_metrics"
        point_ru: "На holdout считают confusion matrix и показатели по классам, особенно долю ложных принятий; одной accuracy или kappa недостаточно."
      - id: "manual_route"
        point_ru: "Расхождение независимых проверок, выход за область калибровки или ошибка судьи ведут в ручную проверку, а не в автоматическое принятие."
      - id: "versioned_evidence"
        point_ru: "Сохраняют версию шкалы, модели, входов и решения, чтобы воспроизводить регрессии."
    reference_explanation_ru: >-
      LLM-судья полезен для критериев, которые трудно выразить правилом, но его вывод
      не является истиной. Надёжный контур задаёт явную шкалу, структурирует ответ,
      сравнивает решения с независимо размеченным набором, разрешает разногласия по
      явному правилу и оставляет отдельный holdout. Самооценка уверенности судьи не
      является вероятностью правильности: автоматический маршрут задают по эмпирически
      проверенному порогу для конкретного класса сценариев. На holdout считают confusion
      matrix и показатели по классам, особенно долю ложных принятий; одной accuracy
      или kappa недостаточно. Всё, что можно проверить кодом или по источнику, проходит
      повторную проверку. Расхождение проверок, выход за область калибровки или ошибка
      судьи ведут к человеку. Версии входов, шкалы и судьи сохраняются как доказательство.
    follow_ups:
      - "Какие примеры включить в набор калибровки судьи?"
      - "Как заметить, что новая версия модели-судьи изменила строгость оценки?"
