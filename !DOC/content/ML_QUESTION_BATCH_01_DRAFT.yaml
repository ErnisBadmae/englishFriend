  - question_key: "mltech_029"
    revision_no: 1
    content_fingerprint: "f684348f552ed4022dc13ede5ce021262a906a9c25f492cf8a9dce2ed94aa72a"
    status: "draft"
    topic_id: "dl_training"
    question_ru: "Как смешанная точность ускоряет обучение, чем FP16 отличается от BF16 и зачем при FP16 нужен масштаб функции потерь?"
    difficulty: "medium"
    tags:
      - "mixed_precision"
      - "fp16"
      - "bf16"
      - "loss_scaling"
      - "training_stability"
    rubric_points:
      - id: "compute_memory_benefit"
        point_ru: "Меньшая точность снижает расход памяти и на поддерживаемом ускорителе увеличивает скорость матричных операций."
      - id: "mixed_roles"
        point_ru: "Чувствительные операции, основные веса или состояния оптимизатора часто сохраняют в более высокой точности."
      - id: "fp16_range"
        point_ru: "У FP16 уже диапазон показателей степени, поэтому малые градиенты могут округляться до нуля, а большие - переполняться."
      - id: "bf16_tradeoff"
        point_ru: "BF16 имеет диапазон, близкий к FP32, но меньшую точность мантиссы, поэтому обычно устойчивее FP16 к переполнению."
      - id: "loss_scaling"
        point_ru: "Масштабирование функции потерь временно увеличивает градиенты перед обратным проходом, после чего масштаб снимается перед обновлением весов."
      - id: "stability_checks"
        point_ru: "Следят за NaN, переполнением, нормой градиента и качеством, а при нестабильности оставляют отдельные операции в FP32."
    reference_explanation_ru: >-
      Смешанная точность выполняет большую часть дорогих операций в FP16 или BF16,
      но сохраняет чувствительные вычисления и состояния в FP32. Это уменьшает память
      и ускоряет обучение на подходящем оборудовании. FP16 имеет узкий числовой диапазон,
      поэтому малые градиенты могут исчезать; масштаб функции потерь сдвигает их в
      представимый диапазон. BF16 сохраняет широкий диапазон FP32, но жертвует точностью мантиссы.
    follow_ups:
      - "Почему масштаб снимают до шага оптимизатора?"
      - "Какие операции чаще оставляют в FP32 и почему?"
