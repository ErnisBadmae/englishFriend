questions:
  - question_key: "mltech_016"
    revision_no: 1
    content_fingerprint: "017eb6614a1d8075307aed31b17e55393a8e08d20b480cfd4c2a38a4b62bef84"
    status: "draft"
    topic_id: "recsys_ranking"
    question_ru: "Зачем рекомендательной системе два этапа - отбор кандидатов и ранжирование - и чем должны отличаться их цели и модели?"
    difficulty: "medium"
    tags:
      - "candidate_generation"
      - "ranking"
      - "two_stage_recsys"
      - "recall_at_k"
    rubric_points:
      - id: "catalog_reduction"
        point_ru: "Отбор кандидатов быстро сокращает весь каталог до небольшого набора, который можно обработать более дорогой моделью."
      - id: "first_stage_objective"
        point_ru: "Первый этап оптимизируют на высокий охват подходящих объектов, иначе потерянный объект уже не вернётся на этапе ранжирования."
      - id: "second_stage_objective"
        point_ru: "Ранжирование использует больше признаков и точнее упорядочивает кандидатов под продуктовую цель."
      - id: "different_models"
        point_ru: "Для отбора подходят быстрые методы близости, матричные модели или правила, а для ранжирования - бустинг или нейросеть."
      - id: "end_to_end_measurement"
        point_ru: "Качество проверяют отдельно по этапам и целиком: охват кандидатов, метрики порядка, задержка и продуктовый результат."
    reference_explanation_ru: >-
      Полный каталог обычно слишком велик для сложной модели на каждый запрос.
      Поэтому быстрый первый этап выбирает сотни кандидатов с упором на охват,
      а второй использует более богатые признаки и упорядочивает десятки лучших.
      Ошибка первого этапа необратима: объект, не попавший в кандидаты, ранжировщик
      уже не увидит. Из-за этого этапы требуют разных моделей, бюджетов задержки и метрик.
    follow_ups:
      - "Как измерить, что первый этап не стал узким местом всей системы?"
      - "Какие источники кандидатов можно объединить для нового и постоянного пользователя?"
    rubric_version: "ml-technical-v1"
    source_kind: "private_corpus"
    source_label: "anonymized interview corpus"
    source_uri_public: null
    source_fingerprint: null
    derivation_kind: "paraphrase"
    publication_scope: "internal_only"
    license_note: 'Private anonymized interview-derived material; internal study only; no publication rights claimed.'
    model_id: "openai-codex-gpt-5.5"
    prompt_version: "ml-question-batch-01-draft-v1"
    reviewer_note_ru: "Черновик под вакансию первого специалиста по данным. Проверить полноту метрик двух этапов."

  - question_key: "mltech_017"
    revision_no: 1
    content_fingerprint: "d88b3443a9b4f0af0b82ddb66d93ff9d3c72034e7bce8c066ba65f105f7fd9d8"
    status: "draft"
    topic_id: "recsys_ranking"
    question_ru: "Как обучается ALS для неявной обратной связи и почему отсутствие взаимодействия нельзя считать явной отрицательной оценкой?"
    difficulty: "medium"
    tags:
      - "als"
      - "implicit_feedback"
      - "matrix_factorization"
      - "confidence_weighting"
    rubric_points:
      - id: "latent_factors"
        point_ru: "ALS раскладывает матрицу пользователь-объект на скрытые векторы пользователей и объектов."
      - id: "alternating_updates"
        point_ru: "Алгоритм попеременно фиксирует одну матрицу факторов и решает задачу наименьших квадратов для другой."
      - id: "binary_preference"
        point_ru: "В классической постановке бинарное предпочтение задают как p_ui = 1[r_ui > 0], а для ненаблюдаемой пары p_ui = 0."
      - id: "confidence_weighting"
        point_ru: "Вес уверенности отделяют от предпочтения, например c_ui = 1 + alpha * r_ui; у ненаблюдаемой пары остаётся ненулевой базовый вес."
      - id: "weighted_objective"
        point_ru: "Цель суммирует c_ui * (p_ui - x_u^T y_i)^2 по наблюдаемым и ненаблюдаемым парам и добавляет регуляризацию факторов."
      - id: "missing_not_negative"
        point_ru: "p_ui = 0 означает отсутствие подтверждённого предпочтения, а не достоверный отказ: пользователь мог не увидеть объект."
    reference_explanation_ru: >-
      ALS приближает разреженную матрицу взаимодействий произведением двух матриц
      скрытых факторов и по очереди обновляет факторы пользователей и объектов.
      В классической постановке для неявной обратной связи задают предпочтение
      p_ui = 1[r_ui > 0] и уверенность c_ui = 1 + alpha * r_ui. Затем минимизируют
      сумму c_ui * (p_ui - x_u^T y_i)^2 по всем парам пользователь-объект с
      регуляризацией факторов. Ненаблюдаемая пара участвует в цели с p_ui = 0 и
      ненулевым базовым весом, но не считается достоверным отрицательным классом:
      пользователь мог просто не увидеть объект.
    follow_ups:
      - "Как ранг факторов и регуляризация влияют на качество и стоимость ALS?"
      - "Как добавить в такую систему признаки пользователя и объекта?"
    rubric_version: "ml-technical-v1"
    source_kind: "private_corpus"
    source_label: "anonymized interview corpus"
    source_uri_public: null
    source_fingerprint: null
    derivation_kind: "paraphrase"
    publication_scope: "internal_only"
    license_note: 'Private anonymized interview-derived material; internal study only; no publication rights claimed.'
    model_id: "openai-codex-gpt-5.5"
    prompt_version: "ml-question-batch-01-draft-v1"
    reviewer_note_ru: "Черновик. Проверить формулировку цели для implicit ALS и границу с явными оценками."

  - question_key: "mltech_018"
    revision_no: 1
    content_fingerprint: "0393c07b44619806b0e74bf18a2e25d8c85c838507e8d467a98a12855100b123"
    status: "draft"
    topic_id: "recsys_ranking"
    question_ru: "Чем отличаются Recall@K, MRR, MAP@K и NDCG@K и какую метрику выбрать для разных рекомендательных сценариев?"
    difficulty: "medium"
    tags:
      - "offline_metrics"
      - "recall_at_k"
      - "mrr"
      - "map_at_k"
      - "ndcg"
    rubric_points:
      - id: "recall_meaning"
        point_ru: "Recall@K измеряет долю релевантных объектов, попавших в первые K позиций, и полезен для проверки полноты кандидатов."
      - id: "mrr_meaning"
        point_ru: "MRR зависит от позиции первого релевантного результата и подходит, когда достаточно одного хорошего ответа."
      - id: "map_meaning"
        point_ru: "В этом пакете AP@K = sum(P@i * rel_i) / min(K, R), а MAP@K - среднее AP@K по запросам; AP не смешивают с трапецеидальной площадью под PR-кривой."
      - id: "ndcg_meaning"
        point_ru: "NDCG@K делит DCG на идеальный DCG, сильнее штрафует полезные объекты на низких позициях и поддерживает градации релевантности."
      - id: "edge_cases"
        point_ru: "Запросы с R = 0 или IDCG = 0 исключают из среднего и отдельно показывают их долю; при одном релевантном объекте Recall@K становится индикатором попадания, а AP и MRR зависят от его позиции."
      - id: "candidate_protocol"
        point_ru: "Метрики зависят от кандидатного набора, правил разметки и построения теста, поэтому значения из разных протоколов напрямую не сравнивают."
      - id: "metric_choice"
        point_ru: "Метрику выбирают по пользовательскому действию и месту этапа в системе, а не по максимальному значению одной удобной метрики."
    reference_explanation_ru: >-
      Эти метрики отвечают на разные вопросы. Recall@K проверяет, сколько нужного
      найдено; MRR - насколько высоко стоит первый полезный объект. Здесь AP@K
      определена как сумма P@i на релевантных позициях, делённая на min(K, R),
      а MAP@K - как среднее AP@K; это не трапецеидальная площадь под PR-кривой.
      NDCG@K нормирует DCG на идеальный порядок и поддерживает градации полезности.
      Запросы без релевантных объектов или с IDCG = 0 исключаются из среднего, а
      их доля показывается отдельно. При единственном релевантном объекте Recall@K
      становится индикатором попадания, а AP и MRR учитывают его позицию. Сравнение
      имеет смысл только при одном составе кандидатов, протоколе теста и разметке.
    follow_ups:
      - "Почему рост NDCG может не привести к росту продуктовой метрики?"
      - "Как считать метрики, если у пользователя в тесте только одно взаимодействие?"
    rubric_version: "ml-technical-v1"
    source_kind: "private_corpus"
    source_label: "anonymized interview corpus"
    source_uri_public: null
    source_fingerprint: null
    derivation_kind: "paraphrase"
    publication_scope: "internal_only"
    license_note: 'Private anonymized interview-derived material; internal study only; no publication rights claimed.'
    model_id: "openai-codex-gpt-5.5"
    prompt_version: "ml-question-batch-01-draft-v1"
    reviewer_note_ru: "Черновик. Формулы намеренно не включены в основной вопрос, но смысл метрик должен быть проверен строго."

  - question_key: "mltech_019"
    revision_no: 1
    content_fingerprint: "5f706e2ec44ec052e9e3c70c9d5f2f9bc78cd2c218ab2391c97d9b647b117a43"
    status: "draft"
    topic_id: "recsys_ranking"
    question_ru: "Как выбирать отрицательные примеры для обучения рекомендательной модели и какие смещения создаёт случайная выборка из всего каталога?"
    difficulty: "hard"
    tags:
      - "negative_sampling"
      - "exposure_bias"
      - "hard_negatives"
      - "implicit_feedback"
    rubric_points:
      - id: "unobserved_ambiguity"
        point_ru: "Отсутствие действия не доказывает неприязнь: объект мог не попасть в поле зрения пользователя."
      - id: "exposed_negatives"
        point_ru: "Показ без целевого действия информативнее случайного объекта, но не является честным отрицательным примером без учёта позиции, интерфейса и политики показа."
      - id: "easy_negative_bias"
        point_ru: "Случайная выборка создаёт слишком простые отрицательные примеры и может завысить офлайн-качество."
      - id: "hard_negatives"
        point_ru: "Сложные отрицательные примеры берут из похожих или высоко оценённых объектов, но контролируют ложные отрицательные метки у непросмотренных и неудачно показанных объектов."
      - id: "exposure_correction"
        point_ru: "Смещение показа оценивают через рандомизированный exploration-трафик или корректируют по известной вероятности показа, учитывая дисперсию и ограничение больших весов."
      - id: "sampling_vs_calibration"
        point_ru: "Веса исправляют известное изменение распределения выборки, а калибровка на представительном наборе меняет шкалу оценок, но сама не устраняет смещение обучения."
    reference_explanation_ru: >-
      В неявных данных нет готового класса отказа. Случайный объект из огромного
      каталога часто не видел пользователь, поэтому модель учится отличать очевидно
      нерелевантное и выглядит лучше, чем есть. Показ без действия информативнее,
      но остаётся смещён позицией, интерфейсом и прежней политикой рекомендаций.
      Для оценки причинного эффекта показа полезен рандомизированный exploration-трафик;
      при известных вероятностях показа применяют propensity weighting с контролем
      дисперсии. Сложные отрицательные примеры полезны, но повышают риск ложной метки.
      Коррекция выборки и калибровка решают разные задачи: первая исправляет известное
      изменение распределения, вторая на представительном наборе настраивает шкалу
      оценок и сама по себе не убирает смещение обучения.
    follow_ups:
      - "Когда сложные отрицательные примеры начинают вредить обучению?"
      - "Как изменится оценка модели, если отрицательные примеры выбирать иначе на обучении и на тесте?"
    rubric_version: "ml-technical-v1"
    source_kind: "private_corpus"
    source_label: "anonymized interview corpus"
    source_uri_public: null
    source_fingerprint: null
    derivation_kind: "paraphrase"
    publication_scope: "internal_only"
    license_note: 'Private anonymized interview-derived material; internal study only; no publication rights claimed.'
    model_id: "openai-codex-gpt-5.5"
    prompt_version: "ml-question-batch-01-draft-v1"
    reviewer_note_ru: "Черновик. Требуется особенно внимательно проверить причинные утверждения про показы и пропуски."

  - question_key: "mltech_020"
    revision_no: 1
    content_fingerprint: "4e52d937e2c5effa5f6aefa24e2885428f2a8e87aec8a595ca2577ca07ef6c3e"
    status: "draft"
    topic_id: "recsys_ranking"
    question_ru: "Как построить временную проверку рекомендательной системы без утечки будущего и отдельно измерить холодный старт?"
    difficulty: "hard"
    tags:
      - "temporal_validation"
      - "data_leakage"
      - "cold_start"
      - "offline_evaluation"
    rubric_points:
      - id: "time_boundary"
        point_ru: "Обучение использует только события до временной границы, а проверка - более поздние события."
      - id: "feature_cutoff"
        point_ru: "Все признаки и агрегаты вычисляют на момент рекомендации, не используя будущие действия пользователя или объекта."
      - id: "candidate_availability"
        point_ru: "В кандидаты допускают только объекты, которые были доступны в соответствующий момент времени."
      - id: "label_horizon"
        point_ru: "Для метки задают горизонт после cutoff; события из незавершённого окна не попадают в обучение частично, а пересекающиеся окна при необходимости разделяют gap или embargo."
      - id: "separate_cold_start"
        point_ru: "Новый пользователь или объект отсутствует в обучающей истории на момент оценки, а не просто редко встречается; эти случаи считают отдельными срезами."
      - id: "repeated_windows"
        point_ru: "Несколько последовательных временных окон помогают проверить устойчивость к сезонности и дрейфу."
    reference_explanation_ru: >-
      Случайное перемешивание взаимодействий переносит сведения из будущего в
      обучение и признаки. Честная схема воспроизводит момент рекомендации: история,
      агрегаты и доступный каталог обрезаются по времени, затем качество считается на
      последующих действиях. Для метки задают полный горизонт после cutoff, а для
      пересекающихся окон при необходимости оставляют gap или embargo. Новый
      пользователь или объект должен отсутствовать в обучающей истории на момент
      оценки, а не просто иметь мало событий. Сценарии с известными пользователями и
      объектами нельзя смешивать с холодным стартом. Несколько окон дают более
      устойчивую оценку, чем единственная дата разделения.
    follow_ups:
      - "Какая утечка возникнет, если популярность объекта посчитать по всему периоду?"
      - "Как сравнить модель для новых пользователей с моделью для пользователей с историей?"
    rubric_version: "ml-technical-v1"
