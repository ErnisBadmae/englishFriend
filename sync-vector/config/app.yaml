kafka:
  brokers:
    - kafka:29092
  topic: memories_public
  consumer_group: sync-vector
  dlq_topic: vector_failures
  max_poll_records: 500

qdrant:
  url: http://qdrant:6333
  api_key: ""
  collection: user_memories
  vector_dim: 1536
  batch_size: 64
  timeout_ms: 2000

ingest:
  max_retries: 5
  backoff_ms: 250

observability:
  metrics_port: 8090
  log_level: info
