[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "services do not import api"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "app does not import main"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["main"]

[tool.docs-maintenance]
doc_dir = "!DOC"
session_log = "!DOC/operations/SESSION_LOG.md"
archive_dir = "!DOC/operations/archive"
tier0_files = [
  "!DOC/README.md",
  "!DOC/ARCHITECTURE.md",
  "!DOC/operations/CURRENT_PRODUCT_STATE.md",
  "!DOC/operations/SESSION_LOG.md"
]
context_budget_lines = 2000
