version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ef_postgres
    environment:
      POSTGRES_DB: english_friend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_friend"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ef_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/english_friend
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_PROVIDER: openai_realtime
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # hot reload

volumes:
  postgres_data:
