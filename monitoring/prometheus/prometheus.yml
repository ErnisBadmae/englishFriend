global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'english-friend'
    environment: 'development'

scrape_configs:
  # FastAPI основной API (host machine)
  - job_name: 'fastapi'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'fastapi'
          component: 'api'

  # Sync-Vector сервис (docker network)
  - job_name: 'sync-vector'
    static_configs:
      - targets: ['sync-vector:8090']
        labels:
          service: 'sync-vector'
          component: 'cdc'
          pipeline: 'vector'

  # Sync-Graph сервис (docker network)
  - job_name: 'sync-graph'
    static_configs:
      - targets: ['sync-graph:8091']
        labels:
          service: 'sync-graph'
          component: 'cdc'
          pipeline: 'graph'

  # Debezium Connect (JMX metrics if available)
  - job_name: 'debezium'
    static_configs:
      - targets: ['debezium:8083']
        labels:
          service: 'debezium'
          component: 'cdc'
    metrics_path: /metrics
    # Debezium doesn't expose prometheus by default, this is a placeholder

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

