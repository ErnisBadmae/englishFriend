kafka:
  brokers:
    - kafka:9092
  topics:
    - sessions_public
    - utterances_public
    - corrections_public
    - user_interest_public
  group_id: sync-graph
  batch_size: 500
  poll_timeout_ms: 500
  dlq_topic: graph_failures

neo4j:
  uri: bolt://neo4j:7687
  user: neo4j
  password: password
  ingest_script: /app/graph/schema/ingest.cypher

observability:
  port: 8091
  log_level: info
