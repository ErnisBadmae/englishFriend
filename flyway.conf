# Flyway configuration for English Friend database
# Usage: flyway -configFiles=flyway.conf migrate

flyway.url=jdbc:postgresql://localhost:5432/englishfriend_dev
flyway.user=postgres
flyway.password=postgres
flyway.schemas=public
flyway.locations=filesystem:db/migrations/postgres
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=false
flyway.outOfOrder=false
flyway.placeholderReplacement=true
flyway.placeholderPrefix=${
flyway.placeholderSuffix=}
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.encoding=UTF-8
flyway.table=flyway_schema_history
